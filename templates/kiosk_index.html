<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Kiosk Perpustakaan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    .kiosk-card {
      background: #ffffff;
      border-radius: 1rem;
      padding: 2rem 1.75rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      margin-top: 1rem;
    }

    .kiosk-header {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    .kiosk-logo { font-size: 2.5rem; }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #1a202c;
      margin-top: 0.4rem;
    }
    .kiosk-subtitle {
      color: #718096;
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    /* ── Status bar ─────────────────────────────────────────── */
    .kiosk-status {
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      margin-bottom: 1rem;
      line-height: 1.5;
      transition: background 0.2s, color 0.2s;
    }
    .kiosk-status--idle {
      background: #ebf8ff; color: #2b6cb0; border: 1px solid #90cdf4;
    }
    .kiosk-status--processing {
      background: #fffbeb; color: #92400e; border: 1px solid #fbbf24;
    }
    .kiosk-status--format_ok {
      background: #f0fff4; color: #22543d; border: 1px solid #68d391;
    }
    .kiosk-status--format_bad {
      background: #fff5f5; color: #742a2a; border: 1px solid #fc8181;
    }
    .kiosk-status--server_error {
      background: #fff5f5; color: #742a2a; border: 1px solid #fc8181;
    }
    .kiosk-status--camera_error {
      background: #faf5ff; color: #553c9a; border: 1px solid #b794f4;
    }

    /* ── QR reader container ─────────────────────────────────── */
    #kiosk-qr-reader {
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;
      margin-bottom: 1rem;
      /* html5-qrcode injects its own UI here */
    }

    /* ── Tombol ──────────────────────────────────────────────── */
    .btn {
      display: inline-block;
      border: none;
      border-radius: 0.4rem;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-secondary {
      background: #e2e8f0; color: #2d3748;
    }
    .btn-primary {
      background: #3182ce; color: #ffffff;
    }

    #kiosk-manual-btn {
      width: 100%;
      margin-bottom: 0.75rem;
    }

    /* ── Manual input area ──────────────────────────────────── */
    #kiosk-manual-area {
      margin-bottom: 0.75rem;
    }
    #kiosk-manual-area label {
      display: block;
      font-size: 0.85rem;
      color: #4a5568;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    .manual-row {
      display: flex;
      gap: 0.5rem;
    }
    #kiosk-manual-input {
      flex: 1;
      border: 1px solid #cbd5e0;
      border-radius: 0.4rem;
      padding: 0.55rem 0.75rem;
      font-size: 1rem;
      font-family: monospace;
      letter-spacing: 0.02em;
    }
    #kiosk-manual-input:focus {
      outline: 2px solid #3182ce;
      border-color: #3182ce;
    }

    .kiosk-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #a0aec0;
      font-size: 0.75rem;
    }

    /* Format note */
    .format-note {
      font-size: 0.78rem;
      color: #718096;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    /* Area info anggota (K.03) */
    .kiosk-member-info {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      border-radius: 0.5rem;
      padding: 0.6rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
      color: #2c5282;
      text-align: center;
    }

    /* Daftar keranjang */
    .kiosk-cart-area {
      background: #f0fff4;
      border: 1px solid #c6f6d5;
      border-radius: 0.5rem;
      padding: 0.6rem 1rem;
      margin-bottom: 0.75rem;
      text-align: left;
    }
    .kiosk-cart-area h3 {
      font-size: 0.85rem;
      color: #276749;
      margin: 0 0 0.4rem 0;
    }
    #kiosk-cart-list {
      list-style: none;
      padding: 0;
      margin: 0 0 0.3rem 0;
      font-size: 0.82rem;
      color: #2d3748;
      max-height: 140px;
      overflow-y: auto;
    }
    #kiosk-cart-list li {
      padding: 0.15rem 0;
      border-bottom: 1px solid #c6f6d5;
    }
    #kiosk-cart-list li:last-child { border-bottom: none; }
    .kiosk-cart-count {
      font-size: 0.78rem;
      color: #276749;
      margin: 0;
    }

    /* Tombol Batal */
    .btn-danger {
      background: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    .btn-danger:hover { background: #c53030; }

    /* Status state tambahan */
    .kiosk-status--member_ok { background: #c6f6d5; color: #276749; }
    .kiosk-status--copy_ok   { background: #bee3f8; color: #2c5282; }
  </style>
</head>
<body>
  <div class="kiosk-card">
    <div class="kiosk-header">
      <div class="kiosk-logo">📚</div>
      <h1>Kiosk Perpustakaan</h1>
      <p class="kiosk-subtitle">Layanan Mandiri Anggota</p>
    </div>

    <!-- Status bar — diperbarui oleh kiosk_scan.js -->
    <div id="kiosk-status" class="kiosk-status kiosk-status--idle" role="status" aria-live="polite">
      Memuat kamera…
    </div>

    <!-- Area info anggota (K.03 — muncul setelah scan kartu berhasil) -->
    <div id="kiosk-member-info" class="kiosk-member-info" hidden aria-live="polite">
      👤 <strong id="kiosk-member-name"></strong>
    </div>

    <!-- Daftar keranjang sementara (muncul setelah kartu tervalidasi) -->
    <div id="kiosk-cart-area" class="kiosk-cart-area" hidden aria-live="polite">
      <h3>📋 Buku yang akan dipinjam:</h3>
      <ul id="kiosk-cart-list"></ul>
      <p class="kiosk-cart-count" id="kiosk-cart-count"></p>
    </div>

    <!-- Tombol Batal — muncul setelah scan kartu berhasil (K.04) -->
    <button id="kiosk-cancel-btn" class="btn btn-danger" hidden type="button"
            aria-label="Batalkan sesi pinjam">
      ✕ Batalkan Sesi
    </button>

    <!-- Area kamera — diisi oleh html5-qrcode -->
    <div id="kiosk-qr-reader"></div>

    <!-- Tombol fallback manual (default tersembunyi; muncul saat kamera gagal atau diklik) -->
    <button id="kiosk-manual-btn" class="btn btn-secondary" type="button">
      ✍ Masukkan kode secara manual
    </button>

    <!-- Area input manual (default tersembunyi) -->
    <div id="kiosk-manual-area" hidden>
      <label for="kiosk-manual-input">Ketik kode QR dari kartu atau label buku:</label>
      <div class="manual-row">
        <input
          type="text"
          id="kiosk-manual-input"
          name="kiosk_manual_code"
          maxlength="200"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Contoh: M-AB1234 atau C-XY5678"
          aria-label="Kode QR manual"
        >
        <button id="kiosk-manual-submit" class="btn btn-primary" type="button">Kirim</button>
      </div>
    </div>

    <p class="kiosk-footer">
      Sistem Perpustakaan Digital Sekolah &mdash; Kiosk v0.3 (Task 5-04)
    </p>
  </div>

  <!--
    Library QR dimuat dari vendor lokal (Task 5-01, Zero CDN Policy).
    Dilarang mengganti dengan CDN eksternal.
  -->
  <script src="/static/vendor/html5-qrcode/html5-qrcode.min.js"></script>
  <!-- Skrip kiosk — debounce & UI feedback (Task 5-03) -->
  <script src="/static/js/kiosk_scan.js"></script>
</body>
</html>
